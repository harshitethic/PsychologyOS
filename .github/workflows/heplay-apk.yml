name: HEPlay APK build

on:
  push:
    branches:
      - heplay-apk-build
    paths:
      - ".heplay-build/**"
      - ".github/workflows/heplay-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Resolve exact source download
        shell: bash
        run: |
          PAGE="https://firestorage.ai/ja/f/W4ZQDyTJcAT1"
          curl -L --fail -sS "$PAGE" -o /tmp/firestorage.html
          JS_PATH="$(grep -oE '/_next/static/chunks/app/\(files\)/ja/f/page-[A-Za-z0-9]+\.js' /tmp/firestorage.html | head -1)"
          test -n "$JS_PATH"
          echo "bundle=$JS_PATH"
          curl -L --fail -sS "https://firestorage.ai$JS_PATH" -o /tmp/firestorage.js
          echo "--- download/api strings ---"
          grep -oE '.{0,140}(download|/api/|shareId|publicId).{0,220}' /tmp/firestorage.js | head -100 || true
          exit 2

      - name: Restore HEPlay source
        run: echo placeholder

      - name: Build debug APK
        run: echo placeholder
