name: HEPlay APK build

on:
  push:
    branches:
      - heplay-apk-build
    paths:
      - ".heplay-build/**"
      - ".github/workflows/heplay-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore HEPlay source
        run: |
          cat .heplay-build/src.part* | base64 -d > /tmp/heplay.zip
          rm -rf /tmp/heplay-src
          mkdir -p /tmp/heplay-src
          unzip -q /tmp/heplay.zip -d /tmp/heplay-src
          test -f /tmp/heplay-src/HEPlay/app/build.gradle.kts

      - name: Build debug APK
        working-directory: /tmp/heplay-src/HEPlay
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f /tmp/heplay-src/HEPlay/app/build/outputs/apk/debug/app-debug.apk
          cp /tmp/heplay-src/HEPlay/app/build/outputs/apk/debug/app-debug.apk /tmp/HEPlay-v0.2.apk
          sha256sum /tmp/HEPlay-v0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HEPlay-v0.2-apk
          path: /tmp/HEPlay-v0.2.apk
          if-no-files-found: error
