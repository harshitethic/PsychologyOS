name: HEPlay APK build
on:
  push:
    branches: [heplay-apk-build]
    paths: [".github/workflows/heplay-apk.yml"]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Firestorage API host
        run: |
          curl -L -sS "https://firestorage.ai/ja/f/W4ZQDyTJcAT1" -o /tmp/page
          grep -oE '/_next/static/chunks/[A-Za-z0-9_./()%-]+\.js' /tmp/page | sort -u > /tmp/paths
          : > /tmp/all.js
          while read -r p; do curl -L -sS "https://firestorage.ai$p" >> /tmp/all.js || true; done < /tmp/paths
          echo "=== URLs ==="
          grep -oE 'https://[^"'''` )}]+' /tmp/all.js | sort -u | head -200 || true
          echo "=== host-like strings ==="
          grep -oE '[A-Za-z0-9.-]+\.firestorage\.ai[^"'''` )}]*' /tmp/all.js | sort -u | head -100 || true
          echo "=== maxResults context ==="
          python3 - <<'PY'
          s=open('/tmp/all.js',errors='ignore').read()
          needle='files?maxResults=1000'
          i=s.find(needle)
          print(s[max(0,i-12000):i+2000] if i>=0 else 'not found')
          PY
          exit 2
