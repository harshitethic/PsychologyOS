name: HEPlay APK build
on:
  push:
    branches: [heplay-apk-build]
    paths: [".github/workflows/heplay-apk.yml"]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Firestorage endpoint logic
        run: |
          curl -L -sS "https://firestorage.ai/ja/f/W4ZQDyTJcAT1" -o /tmp/page
          grep -oE '/_next/static/chunks/[A-Za-z0-9_./()%-]+\.js' /tmp/page | sort -u > /tmp/paths
          : > /tmp/all.js
          while read -r p; do curl -L -sS "https://firestorage.ai$p" >> /tmp/all.js || true; done < /tmp/paths
          python3 - <<'PY'
          s=open('/tmp/all.js',errors='ignore').read()
          for needle in ['shareEndpoint','async function v','/download','/shares/']:
              print('\n===== '+needle+' =====')
              start=0
              for _ in range(5):
                  i=s.find(needle,start)
                  if i<0: break
                  print(s[max(0,i-2500):i+4000])
                  start=i+len(needle)
          PY
          exit 2
