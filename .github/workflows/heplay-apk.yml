name: HEPlay APK build
on:
  push:
    branches: [heplay-apk-build]
    paths: [".github/workflows/heplay-apk.yml"]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Firestorage API prefix
        run: |
          SHARE="W4ZQDyTJcAT1"
          for base in "" "/api" "/api/v1" "/api/public" "/api/files" "/api/file" "/api/download"; do
            url="https://firestorage.ai$base/shares/$SHARE/files?maxResults=1000"
            code=$(curl -L -sS -o /tmp/body -w "%{http_code}" "$url" || true)
            echo "BASE=$base CODE=$code TYPE=$(file -b /tmp/body 2>/dev/null || true)"
            head -c 1200 /tmp/body || true
            echo
            echo "-----"
          done
          exit 2
