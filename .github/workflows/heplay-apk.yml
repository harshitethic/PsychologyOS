name: HEPlay APK build
on:
  push:
    branches: [heplay-apk-build]
    paths: [".github/workflows/heplay-apk.yml"]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Firestorage client chunks
        run: |
          curl -L -sS "https://firestorage.ai/ja/f/W4ZQDyTJcAT1" -o /tmp/page
          grep -oE '/_next/static/chunks/[A-Za-z0-9_./()%-]+\.js' /tmp/page | sort -u > /tmp/paths
          cat /tmp/paths
          n=0
          while read -r p; do
            curl -L -sS "https://firestorage.ai$p" -o "/tmp/c$n.js" || true
            n=$((n+1))
          done < /tmp/paths
          cat /tmp/c*.js > /tmp/all.js
          grep -oE '.{0,120}(/api/|download|presign|signed|shareId|publicId|fileId).{0,220}' /tmp/all.js | head -200 || true
          exit 2
