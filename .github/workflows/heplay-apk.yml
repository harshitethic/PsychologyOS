name: HEPlay APK build
on:
  push:
    branches: [heplay-apk-build]
    paths: [".github/workflows/heplay-apk.yml"]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Firestorage external URLs
        run: |
          curl -L -sS "https://firestorage.ai/ja/f/W4ZQDyTJcAT1" -o /tmp/page
          grep -oE '/_next/static/chunks/[A-Za-z0-9_./()%-]+\.js' /tmp/page | sort -u > /tmp/paths
          : > /tmp/all.js
          while read -r p; do curl -L -sS "https://firestorage.ai$p" >> /tmp/all.js || true; done < /tmp/paths
          python3 - <<'PY'
          import re
          s=open('/tmp/all.js',errors='ignore').read()
          urls=sorted(set(re.findall(r'https?://[^"\\s<>]+',s)))
          print('=== URLS ===')
          for u in urls:
              print(u[:1000])
          print('=== FIRESTORAGE CONTEXT ===')
          for m in re.finditer('firestorage',s,re.I):
              print(s[max(0,m.start()-500):m.start()+900])
          PY
          exit 2
