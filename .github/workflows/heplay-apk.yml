name: HEPlay APK build

on:
  push:
    branches:
      - heplay-apk-build
    paths:
      - ".heplay-build/**"
      - ".github/workflows/heplay-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Inspect exact source share
        shell: bash
        run: |
          curl -L --fail --silent --show-error "https://firestorage.ai/ja/f/W4ZQDyTJcAT1" -o /tmp/source-fetch
          file /tmp/source-fetch
          wc -c /tmp/source-fetch
          sha256sum /tmp/source-fetch
          if unzip -tq /tmp/source-fetch >/dev/null 2>&1; then
            echo "DIRECT_ZIP=yes"
          else
            echo "DIRECT_ZIP=no"
            strings /tmp/source-fetch | grep -Eo 'https?[^" <]+' | head -50 || true
            strings /tmp/source-fetch | grep -Ei 'download|01a0bdb69080770ab98ca1f204a372a5|28NAkOf15YbSSeAL|W4ZQDyTJcAT1' | head -80 || true
            exit 2
          fi

      - name: Restore HEPlay source
        run: |
          rm -rf /tmp/heplay-src
          mkdir -p /tmp/heplay-src
          unzip -q /tmp/source-fetch -d /tmp/heplay-src
          test -f /tmp/heplay-src/HEPlay/app/build.gradle.kts

      - name: Build debug APK
        working-directory: /tmp/heplay-src/HEPlay
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f /tmp/heplay-src/HEPlay/app/build/outputs/apk/debug/app-debug.apk
          cp /tmp/heplay-src/HEPlay/app/build/outputs/apk/debug/app-debug.apk /tmp/HEPlay-v0.2.apk
          sha256sum /tmp/HEPlay-v0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HEPlay-v0.2-apk
          path: /tmp/HEPlay-v0.2.apk
          if-no-files-found: error
