name: HEPlay Modern APK build

on:
  push:
    branches: [heplay-apk-modern]
    paths: [".github/workflows/heplay-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact HEPlay source archive
        shell: bash
        run: |
          API="https://api.firestorage.ai/dev/file"
          SHARE="A7pdYzaJ2bY9"
          curl -L --fail -sS "$API/shares/$SHARE/files?maxResults=1000" -o /tmp/meta.json
          FILE_ID="$(python3 -c 'import json; d=json.load(open("/tmp/meta.json")); print(d["files"][0]["fileId"])')"
          curl -L --fail -sS -X POST "$API/shares/$SHARE/files/$FILE_ID/download" -o /tmp/download.json
          URL="$(python3 -c 'import json; print(json.load(open("/tmp/download.json"))["downloadUrl"])')"
          curl -L --fail -sS "$URL" -o /tmp/heplay.zip
          echo "5da8cb0e34567885de5791d636eafa92721377d83f6058155c5de14ce51c2230  /tmp/heplay.zip" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore and patch modern source
        run: |
          rm -rf /tmp/heplay-src
          mkdir -p /tmp/heplay-src
          unzip -q /tmp/heplay.zip -d /tmp/heplay-src
          cd /tmp/heplay-src/HEPlay
          sed -i 's/minSdk = 23/minSdk = 26/' app/build.gradle.kts
          sed -i 's#implementation("com.github.capullo-tech:lib-tdlib-android:11850efeb5791d4fd386c0eeec1ebce4c5080435")#implementation("io.github.tdlib-android:core:0.1.1")#' app/build.gradle.kts
          grep -n 'minSdk\|tdlib' app/build.gradle.kts

      - name: Build HEPlay debug APK
        working-directory: /tmp/heplay-src/HEPlay
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK=/tmp/heplay-src/HEPlay/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" /tmp/HEPlay-v0.2.1-modern.apk
          sha256sum /tmp/HEPlay-v0.2.1-modern.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HEPlay-v0.2.1-modern-apk
          path: /tmp/HEPlay-v0.2.1-modern.apk
          if-no-files-found: error
