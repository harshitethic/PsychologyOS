name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Test local admin credential setup
        run: npm run test:admin-setup

      - name: Test Prisma dependency compatibility and recursion safety
        run: npm run test:prisma-dependency

      - name: Audit dependency tree
        run: npm audit --audit-level=high

      - name: Run project doctor
        run: npm run doctor

      - name: Test health endpoint
        run: npm run test:health
